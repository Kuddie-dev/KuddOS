<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KuddOS</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="wallpaper"></div>

<header class="topbar">
  <div class="logo">💿 KuddOS</div>
  <div class="clock" id="clock"></div>
</header>

<main id="desktop">
  <div class="app" onclick="openApp('notesApp')">
    <div class="icon">📝</div>
    <span>Notes</span>
  </div>

  <div class="app" onclick="openApp('musicApp')">
    <div class="icon">🎵</div>
    <span>Music</span>
  </div>

  <div class="app" onclick="openApp('uploaderApp')">
    <div class="icon">📦</div>
    <span>Uploader</span>
  </div>

  <div class="app" onclick="openApp('settingsApp')">
    <div class="icon">⚙️</div>
    <span>Settings</span>
  </div>

  <div id="dynamicApps"></div>
</main>

<!-- NOTES -->
<div class="window hidden" id="notesApp">
  <div class="window-header">
    <span>📝 Notes</span>
    <button onclick="closeApp('notesApp')">✕</button>
  </div>

  <div class="notes-controls">
    <input id="folderName" placeholder="Folder name"/>
    <button onclick="createFolder()">Create Folder</button>
  </div>

  <div id="folders"></div>

  <textarea id="noteText" placeholder="Write your note..."></textarea>
  <button class="save-btn" onclick="saveNote()">Save Note</button>
</div>

<!-- MUSIC -->
<div class="window hidden" id="musicApp">
  <div class="window-header">
    <span>🎵 Music Uploader</span>
    <button onclick="closeApp('musicApp')">✕</button>
  </div>

  <input type="file" id="musicUpload" accept="video/*,audio/*"/>
  <button onclick="uploadMusic()">Upload</button>

  <div id="musicList"></div>

  <audio id="audioPlayer" controls></audio>
</div>

<!-- UPLOADER -->
<div class="window hidden" id="uploaderApp">
  <div class="window-header">
    <span>📦 App Uploader</span>
    <button onclick="closeApp('uploaderApp')">✕</button>
  </div>

  <input id="appName" placeholder="App name"/>
  <input id="appEmoji" placeholder="Emoji icon"/>
  <input id="appLink" placeholder="https://example.com"/>
  <button onclick="addWebApp()">Add Website App</button>
</div>

<!-- SETTINGS -->
<div class="window hidden" id="settingsApp">
  <div class="window-header">
    <span>⚙️ Settings</span>
    <button onclick="closeApp('settingsApp')">✕</button>
  </div>

  <p>Wallpaper URL:</p>
  <input id="wallpaperInput" placeholder="Wallpaper image URL"/>
  <button onclick="saveWallpaper()">Apply Wallpaper</button>
</div>

<!-- WEBVIEW -->
<div class="window hidden" id="webviewApp">
  <div class="window-header">
    <span id="webviewTitle">🌐 App</span>
    <button onclick="closeApp('webviewApp')">✕</button>
  </div>
  <iframe id="webFrame"></iframe>
</div>

<script src="script.js"></script>
</body>
</html>
